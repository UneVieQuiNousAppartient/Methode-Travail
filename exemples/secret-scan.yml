# Exemple — recherche de secrets dans tout l'historique Git (gitleaks), avec une base de référence.
# Exemple (Ben's) : patron tiré de son secret-scan.yml (15 oct. 2026), généralisé.
#
# Pourquoi : check-rules.mjs (« secret-en-dur ») et check-secrets-suivis.mjs regardent l'état COURANT du
# dépôt ; un secret poussé puis retiré reste dans l'HISTORIQUE. gitleaks parcourt tous les commits.
#
# Base de référence : sur un dépôt qui a déjà des fuites anciennes (révoquées), on les fige une fois pour
# que seules les NOUVELLES fassent échouer la CI :
#   gitleaks detect --source . --report-path .gitleaksbaseline.json --redact
# Le fichier de base contient des empreintes et des extraits : le committer seulement s'il a été généré
# avec --redact, et chaque secret qu'il cite doit avoir été RÉVOQUÉ. Sans fichier de base, le scan est complet.
name: Secrets

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.18.4
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tout l'historique

      - name: Installer gitleaks (version épinglée)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Rechercher les secrets
        run: |
          if [ -f .gitleaksbaseline.json ]; then
            gitleaks detect --source . --redact --no-banner --baseline-path .gitleaksbaseline.json
          else
            gitleaks detect --source . --redact --no-banner
          fi
